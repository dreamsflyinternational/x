<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Rounded Shield Base -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6" />
  
  <!-- Globe Arc Lines -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.15" />
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.15" />
  <ellipse cx="256" cy="256" rx="60" ry="160" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.15" />
  
  <!-- Flying Jet / Airplane Silhouette -->
  <path d="M 390 130 L 260 220 L 140 180 L 120 200 L 210 250 L 170 330 L 130 320 L 115 335 L 170 380 L 210 370 L 260 410 L 280 390 L 260 290 L 390 130 Z" fill="url(#goldGrad)" />
  
  <!-- Flight Path Trail -->
  <path d="M 100 400 C 140 370, 200 320, 290 230" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-dasharray="16 10" stroke-linecap="round" opacity="0.85" />
  
  <!-- Brand Initials DF Text Accent -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="4">DREAMS FLY</text>
</svg>

    <!-- Immediate Fast Cookie Setter & Google Banner Blocker Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('df_user_lang_pref');
          var googTransVal = '';
          if (saved === 'en') {
            googTransVal = '/bn/en';
          } else if (saved === 'bn') {
            googTransVal = '/bn/bn';
          } else {
            var navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            var tz = '';
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
            var isBd = navLang.includes('bn') || navLang.includes('bd') || tz.includes('Dhaka') || tz.includes('Asia/Dhaka');
            googTransVal = isBd ? '/bn/bn' : '/bn/en';
          }
          if (googTransVal) {
            document.cookie = 'googtrans=' + googTransVal + '; path=/;';
            if (window.location.hostname) {
              document.cookie = 'googtrans=' + googTransVal + '; path=/; domain=' + window.location.hostname + ';';
              document.cookie = 'googtrans=' + googTransVal + '; path=/; domain=.' + window.location.hostname + ';';
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Permanent Google Translate Top Banner Stripper & Layout Lock -->
    <script>
      (function() {
        function cleanGoogleTranslateUI() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.body.style.position && document.body.style.position !== 'static') {
              document.body.style.position = 'static';
            }
          }
          var frames = document.querySelectorAll('.goog-te-banner-frame, iframe.goog-te-banner-frame, iframe.skiptranslate, body > .skiptranslate');
          for (var i = 0; i < frames.length; i++) {
            frames[i].style.display = 'none';
            frames[i].style.visibility = 'hidden';
            frames[i].style.height = '0px';
            frames[i].style.opacity = '0';
          }
        }

        if (window.MutationObserver && document.body) {
          var observer = new MutationObserver(cleanGoogleTranslateUI);
          observer.observe(document.body, { attributes: true, childList: true, subtree: true, attributeFilter: ['style', 'class'] });
        }
        setInterval(cleanGoogleTranslateUI, 300);
      })();
    </script>
